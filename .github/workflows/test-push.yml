name: Poranny raport

on:
  workflow_dispatch:
  schedule:
    - cron: "15 7 * * *"
      timezone: "Europe/Warsaw"

permissions:
  contents: read

jobs:
  send-notification:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pobierz pogodę i najbliższe mecze, a następnie wyślij ntfy
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
          WEATHER_LOCATION: "Pabianice"
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import unicodedata
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          TZ = ZoneInfo("Europe/Warsaw")
          FOOTBALL_BASE = "https://v3.football.api-sports.io"
          VOLLEYBALL_BASE = "https://v1.volleyball.api-sports.io"

          FOOTBALL_TEAMS = [
              ("🔴 Widzew Łódź", "Widzew", "Poland", ["Widzew Łódź", "Widzew Lodz"]),
              ("⚪ Real Madryt", "Real Madrid", "Spain", ["Real Madrid"]),
              ("🔵🔴 FC Barcelona", "Barcelona", "Spain", ["Barcelona", "FC Barcelona"]),
              ("🔴⚫ AC Milan", "AC Milan", "Italy", ["AC Milan", "Milan"]),
          ]

          WMO = {
              0: "bezchmurnie",
              1: "przeważnie słonecznie",
              2: "częściowe zachmurzenie",
              3: "pochmurno",
              45: "mgła",
              48: "mgła z osadzaniem szadzi",
              51: "lekka mżawka",
              53: "mżawka",
              55: "silna mżawka",
              56: "lekka marznąca mżawka",
              57: "silna marznąca mżawka",
              61: "lekki deszcz",
              63: "deszcz",
              65: "silny deszcz",
              66: "lekki marznący deszcz",
              67: "silny marznący deszcz",
              71: "lekki śnieg",
              73: "śnieg",
              75: "silny śnieg",
              77: "ziarna śnieżne",
              80: "lekkie przelotne opady",
              81: "przelotne opady",
              82: "silne przelotne opady",
              85: "lekkie przelotne opady śniegu",
              86: "silne przelotne opady śniegu",
              95: "burze",
              96: "burze z lekkim gradem",
              99: "burze z silnym gradem",
          }

          WEEKDAYS = ["pon.", "wt.", "śr.", "czw.", "pt.", "sob.", "niedz."]

          def normalize(text):
              text = unicodedata.normalize("NFKD", str(text))
              text = "".join(ch for ch in text if not unicodedata.combining(ch))
              return " ".join(text.lower().split())

          def fetch_json(url, headers=None, retries=2):
              request_headers = {
                  "User-Agent": "ntfy-morning-report/1.0",
                  "Accept": "application/json",
              }
              if headers:
                  request_headers.update(headers)

              last_error = None
              for attempt in range(retries + 1):
                  try:
                      req = urllib.request.Request(url, headers=request_headers)
                      with urllib.request.urlopen(req, timeout=25) as response:
                          return json.load(response)
                  except urllib.error.HTTPError as exc:
                      try:
                          body = exc.read().decode("utf-8", errors="replace")[:700]
                      except Exception:
                          body = ""
                      last_error = RuntimeError(
                          f"HTTP {exc.code} {exc.reason}" + (f" | {body}" if body else "")
                      )
                  except Exception as exc:
                      last_error = exc

                  if attempt < retries:
                      time.sleep(1.5 * (attempt + 1))

              raise last_error

          def api_get(base, endpoint, params, api_key):
              query = urllib.parse.urlencode(params)
              url = f"{base}/{endpoint}?{query}"
              data = fetch_json(
                  url,
                  headers={"x-apisports-key": api_key},
                  retries=1,
              )
              errors = data.get("errors")
              if errors:
                  raise RuntimeError(f"API-Sports {endpoint}: {errors}")
              return data

          def weather_report(location):
              geo_params = urllib.parse.urlencode({
                  "name": location,
                  "count": 1,
                  "language": "pl",
                  "format": "json",
              })
              geo = fetch_json(
                  f"https://geocoding-api.open-meteo.com/v1/search?{geo_params}"
              )
              results = geo.get("results") or []
              if not results:
                  raise RuntimeError(f"Nie znaleziono lokalizacji: {location}")

              place = results[0]
              forecast_params = urllib.parse.urlencode({
                  "latitude": place["latitude"],
                  "longitude": place["longitude"],
                  "daily": ",".join([
                      "weather_code",
                      "temperature_2m_min",
                      "temperature_2m_max",
                      "precipitation_probability_max",
                      "precipitation_sum",
                      "wind_speed_10m_max",
                  ]),
                  "timezone": "Europe/Warsaw",
                  "forecast_days": 1,
              })
              data = fetch_json(
                  f"https://api.open-meteo.com/v1/forecast?{forecast_params}"
              )
              daily = data["daily"]

              code = int(daily["weather_code"][0])
              tmin = daily["temperature_2m_min"][0]
              tmax = daily["temperature_2m_max"][0]
              rain_prob = daily["precipitation_probability_max"][0]
              rain_sum = daily["precipitation_sum"][0]
              wind = daily["wind_speed_10m_max"][0]
              description = WMO.get(code, f"kod pogody {code}")

              return (
                  f"🌤 Pogoda — {place['name']}: {description}\n"
                  f"🌡 {tmin:.0f}–{tmax:.0f}°C | "
                  f"🌧 {rain_prob:.0f}% ({rain_sum:.1f} mm) | "
                  f"💨 do {wind:.0f} km/h"
              )

          def resolve_football_team(search, country, preferred_names, api_key):
              data = api_get(
                  FOOTBALL_BASE,
                  "teams",
                  {"search": search},
                  api_key,
              )
              candidates = data.get("response") or []
              if not candidates:
                  raise RuntimeError(f"Brak wyników wyszukiwania drużyny: {search}")

              preferred = {normalize(name) for name in preferred_names}
              search_n = normalize(search)
              best = None
              best_score = -1

              for item in candidates:
                  team = item.get("team", {})
                  name = team.get("name", "")
                  team_country = team.get("country", "")
                  score = 0
                  if normalize(team_country) == normalize(country):
                      score += 30
                  if normalize(name) in preferred:
                      score += 100
                  elif search_n in normalize(name):
                      score += 20

                  if score > best_score:
                      best = team
                      best_score = score

              if not best or best_score < 30:
                  found = [
                      f"{item.get('team', {}).get('name')} ({item.get('team', {}).get('country')})"
                      for item in candidates[:8]
                  ]
                  raise RuntimeError(
                      f"Nie udało się jednoznacznie dopasować {search}; wyniki: {found}"
                  )

              print(f"Football team: {search} -> {best['name']} (ID {best['id']})")
              return best["id"]

          def next_football_match(team_id, api_key):
              data = api_get(
                  FOOTBALL_BASE,
                  "fixtures",
                  {
                      "team": team_id,
                      "next": 1,
                      "timezone": "Europe/Warsaw",
                  },
                  api_key,
              )
              fixtures = data.get("response") or []
              return fixtures[0] if fixtures else None

          def format_football_match(item):
              fixture = item.get("fixture", {})
              start = datetime.fromisoformat(fixture["date"]).astimezone(TZ)
              teams = item.get("teams", {})
              home = teams.get("home", {}).get("name", "?")
              away = teams.get("away", {}).get("name", "?")
              competition = item.get("league", {}).get("name", "")
              day = WEEKDAYS[start.weekday()]
              return (
                  f"{day} {start:%d.%m}, {start:%H:%M} — {home} – {away}"
                  + (f" ({competition})" if competition else "")
              )

          def resolve_poland_volleyball(api_key):
              attempts = [
                  {"search": "Poland"},
                  {"name": "Poland"},
              ]
              errors = []

              for params in attempts:
                  try:
                      data = api_get(VOLLEYBALL_BASE, "teams", params, api_key)
                      candidates = data.get("response") or []
                      if not candidates:
                          continue

                      best = None
                      best_score = -1
                      for item in candidates:
                          team = item.get("team", item)
                          name = team.get("name", "")
                          country = team.get("country") or {}
                          if isinstance(country, dict):
                              country_name = country.get("name", "")
                          else:
                              country_name = str(country)

                          score = 0
                          if normalize(name) == "poland":
                              score += 100
                          elif "poland" in normalize(name):
                              score += 20
                          if normalize(country_name) == "poland":
                              score += 30
                          if team.get("national") is True:
                              score += 20

                          if score > best_score:
                              best = team
                              best_score = score

                      if best and normalize(best.get("name", "")) == "poland":
                          print(
                              f"Volleyball team: Poland -> {best['name']} "
                              f"(ID {best['id']})"
                          )
                          return best["id"]
                  except Exception as exc:
                      errors.append(str(exc))

              raise RuntimeError(
                  "Nie znaleziono reprezentacji Polski w API-Volleyball"
                  + (f" | {' | '.join(errors)}" if errors else "")
              )

          def next_volleyball_match(team_id, api_key):
              now_ts = int(datetime.now(TZ).timestamp())
              year = datetime.now(TZ).year
              future_games = []
              errors = []

              for season in (year, year + 1):
                  try:
                      data = api_get(
                          VOLLEYBALL_BASE,
                          "games",
                          {
                              "team": team_id,
                              "season": season,
                              "timezone": "Europe/Warsaw",
                          },
                          api_key,
                      )
                      for game in data.get("response") or []:
                          ts = int(game.get("timestamp") or 0)
                          if ts >= now_ts:
                              future_games.append(game)
                  except Exception as exc:
                      errors.append(f"sezon {season}: {exc}")

              if future_games:
                  return min(future_games, key=lambda game: int(game.get("timestamp") or 0))

              if errors:
                  raise RuntimeError(" | ".join(errors))
              return None

          def format_volleyball_match(game):
              if game.get("timestamp"):
                  start = datetime.fromtimestamp(int(game["timestamp"]), TZ)
              else:
                  start = datetime.fromisoformat(game["date"]).astimezone(TZ)
              teams = game.get("teams", {})
              home = teams.get("home", {}).get("name", "?")
              away = teams.get("away", {}).get("name", "?")
              competition = game.get("league", {}).get("name", "")
              day = WEEKDAYS[start.weekday()]
              return (
                  f"{day} {start:%d.%m}, {start:%H:%M} — {home} – {away}"
                  + (f" ({competition})" if competition else "")
              )

          topic = os.environ.get("NTFY_TOPIC", "").strip()
          api_key = os.environ.get("APISPORTS_KEY", "").strip()
          location = os.environ.get("WEATHER_LOCATION", "Pabianice").strip()

          if not topic:
              raise RuntimeError("Secret NTFY_TOPIC jest pusty")
          if not api_key:
              raise RuntimeError("Secret APISPORTS_KEY jest pusty lub nie istnieje")

          sections = []

          try:
              sections.append(weather_report(location))
          except Exception as exc:
              print(f"Błąd pogody: {exc}")
              sections.append(f"🌤 Pogoda — {location}: nie udało się pobrać danych")

          match_lines = ["🏟 Najbliższe mecze:"]

          try:
              poland_id = resolve_poland_volleyball(api_key)
              game = next_volleyball_match(poland_id, api_key)
              if game:
                  match_lines.append(
                      f"• 🇵🇱 Polska (siatkówka M): {format_volleyball_match(game)}"
                  )
              else:
                  match_lines.append(
                      "• 🇵🇱 Polska (siatkówka M): brak zaplanowanego meczu w API"
                  )
          except Exception as exc:
              print(f"Błąd terminarza siatkówki: {exc}")
              match_lines.append(
                  "• 🇵🇱 Polska (siatkówka M): nie udało się pobrać terminarza"
              )

          for label, search, country, preferred_names in FOOTBALL_TEAMS:
              try:
                  team_id = resolve_football_team(
                      search, country, preferred_names, api_key
                  )
                  fixture = next_football_match(team_id, api_key)
                  if fixture:
                      match_lines.append(
                          f"• {label}: {format_football_match(fixture)}"
                      )
                  else:
                      match_lines.append(f"• {label}: brak zaplanowanego meczu w API")
              except Exception as exc:
                  print(f"Błąd terminarza dla {label}: {exc}")
                  match_lines.append(f"• {label}: nie udało się pobrać terminarza")

          sections.append("\n".join(match_lines))
          sections.append("Źródła danych: Open-Meteo • API-Sports")
          message = "\n\n".join(sections)

          ntfy_req = urllib.request.Request(
              f"https://ntfy.sh/{urllib.parse.quote(topic, safe='')}",
              data=message.encode("utf-8"),
              headers={
                  "Title": "Poranny raport",
                  "Tags": "partly_sunny,soccer,volleyball",
                  "Content-Type": "text/plain; charset=utf-8",
              },
              method="POST",
          )

          with urllib.request.urlopen(ntfy_req, timeout=20) as response:
              print(f"Powiadomienie wysłane, HTTP {response.status}")
          print(message)
          PY
