name: Poranny raport

on:
  workflow_dispatch:
  schedule:
    - cron: "15 7 * * *"
      timezone: "Europe/Warsaw"

permissions:
  contents: read

jobs:
  send-notification:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pobierz pogodę i najbliższe mecze, a następnie wyślij ntfy
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WEATHER_LOCATION: "Pabianice"
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timedelta, timezone
          from email.utils import parsedate_to_datetime
          from html.parser import HTMLParser
          from zoneinfo import ZoneInfo

          TZ = ZoneInfo("Europe/Warsaw")
          WEEKDAYS = ["pon.", "wt.", "śr.", "czw.", "pt.", "sob.", "niedz."]

          FOOTBALL_TEAMS = [
              ("🔴 Widzew Łódź", "widzew-lodz"),
              ("⚪ Real Madryt", "real-madrid"),
              ("🔵🔴 FC Barcelona", "fc-barcelona"),
              ("🔴⚫ AC Milan", "ac-milan"),
          ]

          WMO = {
              0: "bezchmurnie",
              1: "przeważnie słonecznie",
              2: "częściowe zachmurzenie",
              3: "pochmurno",
              45: "mgła",
              48: "mgła z osadzaniem szadzi",
              51: "lekka mżawka",
              53: "mżawka",
              55: "silna mżawka",
              56: "lekka marznąca mżawka",
              57: "silna marznąca mżawka",
              61: "lekki deszcz",
              63: "deszcz",
              65: "silny deszcz",
              66: "lekki marznący deszcz",
              67: "silny marznący deszcz",
              71: "lekki śnieg",
              73: "śnieg",
              75: "silny śnieg",
              77: "ziarna śnieżne",
              80: "lekkie przelotne opady",
              81: "przelotne opady",
              82: "silne przelotne opady",
              85: "lekkie przelotne opady śniegu",
              86: "silne przelotne opady śniegu",
              95: "burze",
              96: "burze z lekkim gradem",
              99: "burze z silnym gradem",
          }


          WEATHER_ICONS = {
              0: "☀️",
              1: "🌤",
              2: "⛅",
              3: "☁️",
              45: "🌫",
              48: "🌫",
              51: "🌦",
              53: "🌦",
              55: "🌧",
              56: "🌧",
              57: "🌧",
              61: "🌦",
              63: "🌧",
              65: "🌧",
              66: "🌧",
              67: "🌧",
              71: "🌨",
              73: "❄️",
              75: "❄️",
              77: "❄️",
              80: "🌦",
              81: "🌧",
              82: "🌧",
              85: "🌨",
              86: "🌨",
              95: "⛈️",
              96: "⛈️",
              99: "⛈️",
          }


          class TextCollector(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.tokens = []
                  self.ignored_depth = 0

              def handle_starttag(self, tag, attrs):
                  if tag in {"script", "style", "noscript", "svg"}:
                      self.ignored_depth += 1

              def handle_endtag(self, tag):
                  if tag in {"script", "style", "noscript", "svg"} and self.ignored_depth:
                      self.ignored_depth -= 1

              def handle_data(self, data):
                  if self.ignored_depth:
                      return
                  text = " ".join(data.split())
                  if text:
                      self.tokens.append(text)


          def fetch_bytes(url, headers=None, retries=2):
              request_headers = {
                  "User-Agent": (
                      "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                      "AppleWebKit/537.36 (KHTML, like Gecko) "
                      "Chrome/140.0 Safari/537.36"
                  ),
                  "Accept": "*/*",
                  "Accept-Language": "pl-PL,pl;q=0.9,en;q=0.8",
              }
              if headers:
                  request_headers.update(headers)

              last_error = None
              for attempt in range(retries + 1):
                  try:
                      req = urllib.request.Request(url, headers=request_headers)
                      with urllib.request.urlopen(req, timeout=25) as response:
                          return response.read()
                  except urllib.error.HTTPError as exc:
                      try:
                          body = exc.read().decode("utf-8", errors="replace")[:400]
                      except Exception:
                          body = ""
                      last_error = RuntimeError(
                          f"HTTP {exc.code} {exc.reason}"
                          + (f" | {body}" if body else "")
                      )
                  except Exception as exc:
                      last_error = exc

                  if attempt < retries:
                      time.sleep(1.5 * (attempt + 1))

              raise last_error


          def fetch_text(url, headers=None, retries=2):
              raw = fetch_bytes(url, headers=headers, retries=retries)
              return raw.decode("utf-8", errors="replace")


          def fetch_json(url, headers=None, retries=2):
              return json.loads(fetch_text(url, headers=headers, retries=retries))


          def weather_report(location):
              geo_params = urllib.parse.urlencode({
                  "name": location,
                  "count": 1,
                  "language": "pl",
                  "format": "json",
              })

              geo = fetch_json(
                  f"https://geocoding-api.open-meteo.com/v1/search?{geo_params}"
              )

              results = geo.get("results") or []
              if not results:
                  raise RuntimeError(f"Nie znaleziono lokalizacji: {location}")

              place = results[0]

              forecast_params = urllib.parse.urlencode({
                  "latitude": place["latitude"],
                  "longitude": place["longitude"],
                  "daily": ",".join([
                      "weather_code",
                      "temperature_2m_min",
                      "temperature_2m_max",
                      "precipitation_probability_max",
                      "precipitation_sum",
                      "wind_speed_10m_max",
                  ]),
                  "hourly": ",".join([
                      "temperature_2m",
                      "precipitation",
                      "precipitation_probability",
                  ]),
                  "timezone": "Europe/Warsaw",
                  "forecast_days": 4,
              })

              data = fetch_json(
                  f"https://api.open-meteo.com/v1/forecast?{forecast_params}"
              )

              # --- Deszcz na dziś: krótki komunikat na samą górę ---
              hourly = data["hourly"]
              today = datetime.now(TZ).date()
              rainy_hours = []

              for time_str, rain_mm, rain_prob in zip(
                  hourly["time"],
                  hourly["precipitation"],
                  hourly["precipitation_probability"],
              ):
                  hour_dt = datetime.fromisoformat(time_str).replace(tzinfo=TZ)

                  if hour_dt.date() != today:
                      continue

                  # Pomijamy godziny, które już minęły.
                  if hour_dt < datetime.now(TZ).replace(
                      minute=0,
                      second=0,
                      microsecond=0,
                  ):
                      continue

                  rain_mm = float(rain_mm or 0)
                  rain_prob = float(rain_prob or 0)

                  # Za realny opad uznajemy co najmniej 0.1 mm/h.
                  if rain_mm >= 0.1:
                      rainy_hours.append((hour_dt, rain_prob))

              if rainy_hours:
                  ranges = []
                  start_dt = rainy_hours[0][0]
                  prev_dt = rainy_hours[0][0]
                  probs = [rainy_hours[0][1]]

                  for hour_dt, rain_prob in rainy_hours[1:]:
                      if hour_dt - prev_dt == timedelta(hours=1):
                          prev_dt = hour_dt
                          probs.append(rain_prob)
                      else:
                          ranges.append(
                              (
                                  start_dt,
                                  prev_dt + timedelta(hours=1),
                                  max(probs),
                              )
                          )
                          start_dt = hour_dt
                          prev_dt = hour_dt
                          probs = [rain_prob]

                  ranges.append(
                      (
                          start_dt,
                          prev_dt + timedelta(hours=1),
                          max(probs),
                      )
                  )

                  range_texts = []
                  for start_dt, end_dt, max_prob in ranges:
                      range_texts.append(
                          f"{start_dt:%H:%M}–{end_dt:%H:%M}"
                      )

                  max_probability = max(prob for _, prob in rainy_hours)
                  rain_alert = (
                      f"☔ Deszcz dziś: {', '.join(range_texts)} "
                      f"(max {max_probability:.0f}%)"
                  )
              else:
                  # Jeśli model nie przewiduje mierzalnego opadu, ale prawdopodobieństwo
                  # jest podwyższone, informujemy o możliwości deszczu.
                  possible_hours = []
                  for time_str, rain_prob in zip(
                      hourly["time"],
                      hourly["precipitation_probability"],
                  ):
                      hour_dt = datetime.fromisoformat(time_str).replace(tzinfo=TZ)

                      if hour_dt.date() != today:
                          continue

                      if hour_dt < datetime.now(TZ).replace(
                          minute=0,
                          second=0,
                          microsecond=0,
                      ):
                          continue

                      rain_prob = float(rain_prob or 0)
                      if rain_prob >= 50:
                          possible_hours.append((hour_dt, rain_prob))

                  if possible_hours:
                      first_hour = possible_hours[0][0]
                      last_hour = possible_hours[-1][0] + timedelta(hours=1)
                      max_probability = max(prob for _, prob in possible_hours)
                      rain_alert = (
                          f"🌂 Możliwy deszcz dziś: "
                          f"{first_hour:%H:%M}–{last_hour:%H:%M} "
                          f"(max {max_probability:.0f}%)"
                      )
                  else:
                      rain_alert = "☀️ Dziś bez deszczu w prognozie"

              # --- Temperatura godzinowa na najbliższe 24h ---
              now_hour = datetime.now(TZ).replace(
                  minute=0,
                  second=0,
                  microsecond=0,
              )

              hourly_points = []
              for time_str, temp in zip(
                  hourly["time"],
                  hourly["temperature_2m"],
              ):
                  hour_dt = datetime.fromisoformat(time_str).replace(tzinfo=TZ)

                  if hour_dt < now_hour:
                      continue
                  if hour_dt >= now_hour + timedelta(hours=24):
                      continue

                  hourly_points.append(
                      (hour_dt, float(temp))
                  )

              temp_lines = ["🌡 Temperatura — najbliższe 24h:"]

              for hour_dt, temp in hourly_points:
                  temp_lines.append(
                      f"{hour_dt:%H:%M} — {temp:.0f}°C"
                  )

              temperature_24h = "\n".join(temp_lines)

              # --- Prognoza na dziś + 3 kolejne dni ---
              daily = data["daily"]
              lines = [f"🌤 Pogoda — {place['name']}:"]

              for i in range(min(4, len(daily["time"]))):
                  date = datetime.strptime(daily["time"][i], "%Y-%m-%d")
                  code = int(daily["weather_code"][i])

                  tmin = daily["temperature_2m_min"][i]
                  tmax = daily["temperature_2m_max"][i]
                  rain_prob = daily["precipitation_probability_max"][i]
                  rain_sum = daily["precipitation_sum"][i]
                  wind = daily["wind_speed_10m_max"][i]

                  icon = WEATHER_ICONS.get(code, "🌤")

                  if i == 0:
                      date_label = "Dziś"
                  elif i == 1:
                      date_label = "Jutro"
                  else:
                      day = WEEKDAYS[date.weekday()]
                      date_label = f"{day} {date:%d.%m}"

                  lines.append(
                      f"{date_label}: {icon} "
                      f"{tmin:.0f}–{tmax:.0f}°C | "
                      f"🌧 {rain_prob:.0f}% ({rain_sum:.1f} mm) | "
                      f"💨 {wind:.0f} km/h"
                  )

              return rain_alert, "\n".join(lines), temperature_24h


          def unfold_ics(text):
              lines = text.replace("\r\n", "\n").replace("\r", "\n").split("\n")
              unfolded = []
              for line in lines:
                  if line.startswith((" ", "\t")) and unfolded:
                      unfolded[-1] += line[1:]
                  else:
                      unfolded.append(line)
              return unfolded


          def unescape_ics(value):
              return (
                  value.replace("\\n", " ")
                  .replace("\\N", " ")
                  .replace("\\,", ",")
                  .replace("\\;", ";")
                  .replace("\\\\", "\\")
                  .strip()
              )


          def parse_ics_datetime(key, value):
              params = {}
              for part in key.split(";")[1:]:
                  if "=" in part:
                      k, v = part.split("=", 1)
                      params[k.upper()] = v

              value = value.strip()
              if params.get("VALUE") == "DATE" or re.fullmatch(r"\d{8}", value):
                  dt = datetime.strptime(value[:8], "%Y%m%d")
                  return dt.replace(tzinfo=TZ)

              if value.endswith("Z"):
                  dt = datetime.strptime(value, "%Y%m%dT%H%M%SZ")
                  return dt.replace(tzinfo=timezone.utc).astimezone(TZ)

              fmt = "%Y%m%dT%H%M%S" if len(value) >= 15 else "%Y%m%dT%H%M"
              dt = datetime.strptime(value, fmt)
              tzid = params.get("TZID")
              if tzid:
                  try:
                      return dt.replace(tzinfo=ZoneInfo(tzid)).astimezone(TZ)
                  except Exception:
                      pass
              return dt.replace(tzinfo=TZ)


          def parse_ics_events(text):
              events = []
              current = None

              for line in unfold_ics(text):
                  if line == "BEGIN:VEVENT":
                      current = {}
                      continue
                  if line == "END:VEVENT":
                      if current:
                          events.append(current)
                      current = None
                      continue
                  if current is None or ":" not in line:
                      continue

                  key, value = line.split(":", 1)
                  base_key = key.split(";", 1)[0].upper()

                  if base_key == "DTSTART":
                      try:
                          current["start"] = parse_ics_datetime(key, value)
                      except Exception as exc:
                          print(f"Nie udało się sparsować DTSTART {value}: {exc}")
                  elif base_key == "SUMMARY":
                      current["summary"] = unescape_ics(value)
                  elif base_key == "STATUS":
                      current["status"] = value.strip().upper()
                  elif base_key == "DESCRIPTION":
                      current["description"] = unescape_ics(value)

              return events


          def football_from_ics(slug):
              url = f"https://ics.fixtur.es/v2/{slug}.ics"
              text = fetch_text(url, retries=1)
              events = parse_ics_events(text)
              now = datetime.now(TZ)

              future = [
                  event for event in events
                  if event.get("start")
                  and event["start"] > now
                  and event.get("status") != "CANCELLED"
                  and event.get("summary")
              ]
              if not future:
                  return None

              event = min(future, key=lambda x: x["start"])
              print(f"Fixtur.es ICS OK dla {slug}: {event['summary']}")
              return event["start"], event["summary"]


          FOOTBALL_DATE_RE = re.compile(
              r"^\d{1,2} [A-Z][a-z]{2} \d{4} \d{2}:\d{2} [+-]\d{2}:\d{2}$"
          )


          def football_from_html(slug):
              url = f"https://fixtur.es/en/team/{slug}?noTimeZoneConvert=1"
              html = fetch_text(url, retries=1)
              parser = TextCollector()
              parser.feed(html)
              now = datetime.now(TZ)
              matches = []

              for i, token in enumerate(parser.tokens):
                  if not FOOTBALL_DATE_RE.fullmatch(token):
                      continue
                  try:
                      start = datetime.strptime(token, "%d %b %Y %H:%M %z").astimezone(TZ)
                  except Exception:
                      continue
                  if start <= now:
                      continue

                  game = None
                  for candidate in parser.tokens[i + 1:i + 8]:
                      if " - " in candidate and not re.fullmatch(r"\d+\s*[-–:]\s*\d+", candidate):
                          game = candidate.strip()
                          break

                  if game:
                      matches.append((start, game))

              if not matches:
                  return None

              match = min(matches, key=lambda x: x[0])
              print(f"Fixtur.es HTML fallback OK dla {slug}: {match[1]}")
              return match


          def next_football_match(slug):
              errors = []

              try:
                  match = football_from_ics(slug)
                  if match:
                      return match
              except Exception as exc:
                  errors.append(f"ICS: {exc}")
                  print(f"Fixtur.es ICS błąd dla {slug}: {exc}")

              try:
                  match = football_from_html(slug)
                  if match:
                      return match
              except Exception as exc:
                  errors.append(f"HTML: {exc}")
                  print(f"Fixtur.es HTML błąd dla {slug}: {exc}")

              if errors:
                  raise RuntimeError(" | ".join(errors))
              return None


          SCORE_RE = re.compile(r"^\d+\s*:\s*\d+$")
          TIMESTAMP_RE = re.compile(r"(?<!\d)(\d{10})(?!\d)")


          def next_poland_volleyball_from_volleybox():
              url = "https://volleybox.net/poland-t472/matches"
              html = fetch_text(url, retries=1)
              parser = TextCollector()
              parser.feed(html)
              tokens = parser.tokens

              now_ts = int(datetime.now(TZ).timestamp())
              matches = []

              for i, token in enumerate(tokens):
                  timestamp_match = TIMESTAMP_RE.search(token)
                  if not timestamp_match:
                      continue

                  ts = int(timestamp_match.group(1))
                  if ts <= now_ts:
                      continue

                  score_index = None
                  for j in range(i + 1, min(i + 22, len(tokens))):
                      if SCORE_RE.fullmatch(tokens[j]):
                          score_index = j
                          break

                  if score_index is None or score_index <= i + 1:
                      continue
                  if score_index + 1 >= len(tokens):
                      continue

                  team1 = tokens[score_index - 1].strip()
                  team2 = tokens[score_index + 1].strip()

                  if "poland" not in team1.lower() and "poland" not in team2.lower():
                      continue

                  competition = ""
                  for candidate in tokens[i + 1:score_index - 1]:
                      cleaned = candidate.strip(" •")
                      if not cleaned:
                          continue
                      if re.search(r"\d{4}", cleaned) or "league" in cleaned.lower() or "championship" in cleaned.lower() or "memorial" in cleaned.lower() or "cup" in cleaned.lower() or "friendly" in cleaned.lower():
                          competition = cleaned
                          break

                  matches.append({
                      "timestamp": ts,
                      "home": team1,
                      "away": team2,
                      "competition": competition,
                  })

              if not matches:
                  return None

              match = min(matches, key=lambda x: x["timestamp"])
              print(
                  "Volleybox OK: "
                  f"{match['home']} - {match['away']} @ {match['timestamp']}"
              )
              return match


          def next_poland_volleyball_from_espn():
              now = datetime.now(TZ)
              date_from = now.strftime("%Y%m%d")
              date_to = (now + timedelta(days=240)).strftime("%Y%m%d")
              url = (
                  "https://site.api.espn.com/apis/site/v2/sports/"
                  f"volleyball/fivb.m/scoreboard?dates={date_from}-{date_to}&limit=200"
              )
              data = fetch_json(url, retries=1)
              matches = []

              for event in data.get("events") or []:
                  try:
                      start = datetime.fromisoformat(
                          event["date"].replace("Z", "+00:00")
                      ).astimezone(TZ)
                  except Exception:
                      continue
                  if start <= now:
                      continue

                  competition = (event.get("competitions") or [{}])[0]
                  competitors = competition.get("competitors") or []

                  poland_present = False
                  home = None
                  away = None

                  for competitor in competitors:
                      team = competitor.get("team") or {}
                      name = (
                          team.get("displayName")
                          or team.get("shortDisplayName")
                          or team.get("name")
                          or ""
                      )
                      if "poland" in name.lower():
                          poland_present = True
                      if competitor.get("homeAway") == "home":
                          home = name
                      elif competitor.get("homeAway") == "away":
                          away = name

                  if not poland_present:
                      continue

                  if not home or not away:
                      names = [
                          (c.get("team") or {}).get("displayName", "?")
                          for c in competitors
                      ]
                      if len(names) >= 2:
                          home, away = names[0], names[1]

                  matches.append({
                      "timestamp": int(start.timestamp()),
                      "home": home or "?",
                      "away": away or "?",
                      "competition": "FIVB",
                  })

              if not matches:
                  return None

              match = min(matches, key=lambda x: x["timestamp"])
              print(f"ESPN volleyball fallback OK: {match['home']} - {match['away']}")
              return match


          def next_poland_volleyball():
              errors = []

              try:
                  match = next_poland_volleyball_from_volleybox()
                  if match:
                      return match
              except Exception as exc:
                  errors.append(f"Volleybox: {exc}")
                  print(f"Volleybox błąd: {exc}")

              try:
                  match = next_poland_volleyball_from_espn()
                  if match:
                      return match
              except Exception as exc:
                  errors.append(f"ESPN: {exc}")
                  print(f"ESPN volleyball błąd: {exc}")

              if errors:
                  raise RuntimeError(" | ".join(errors))
              return None


          NEWS_RSS_URL = "https://news.google.com/rss?hl=pl&gl=PL&ceid=PL:pl"
          NEWS_MAX_ITEMS = 5
          NEWS_MAX_AGE_HOURS = 30

          NEWS_SKIP_WORDS = {
              "horoskop",
              "znaki zodiaku",
              "lotto",
              "loteria",
              "euromillions",
              "pudelek",
              "pomponik",
              "celebryt",
              "serial",
              "program tv",
              "quiz",
              "transfer",
              "wynik meczu",
              "liga mistrzów",
              "ekstraklasa",
          }

          NEWS_SKIP_SOURCES = {
              "Pudelek",
              "Pomponik",
              "Plotek.pl",
              "Viva.pl",
          }


          def clean_news_title(title, source):
              title = re.sub(r"<[^>]+>", "", title or "")
              title = " ".join(title.split()).strip()
              suffix = f" - {source}" if source else ""
              if suffix and title.endswith(suffix):
                  title = title[:-len(suffix)].strip()
              return title


          def normalized_news_title(title):
              text = title.lower()
              text = re.sub(r"[^a-ząćęłńóśźż0-9 ]+", " ", text)
              return " ".join(text.split())


          def is_soft_news(title, source):
              if source in NEWS_SKIP_SOURCES:
                  return True
              haystack = f"{title} {source}".lower()
              return any(word in haystack for word in NEWS_SKIP_WORDS)


          def important_news():
              raw = fetch_bytes(NEWS_RSS_URL, retries=1)
              root = ET.fromstring(raw)
              now_utc = datetime.now(timezone.utc)
              selected = []
              seen = set()

              for item in root.findall(".//item"):
                  source_node = item.find("source")
                  source = ""
                  if source_node is not None and source_node.text:
                      source = " ".join(source_node.text.split()).strip()

                  title = clean_news_title(item.findtext("title") or "", source)
                  if not title or is_soft_news(title, source):
                      continue

                  published_text = item.findtext("pubDate") or ""
                  if published_text:
                      try:
                          published = parsedate_to_datetime(published_text)
                          if published.tzinfo is None:
                              published = published.replace(tzinfo=timezone.utc)
                          age = now_utc - published.astimezone(timezone.utc)
                          if age.total_seconds() > NEWS_MAX_AGE_HOURS * 3600:
                              continue
                      except Exception as exc:
                          print(f"Nie udało się sparsować daty newsa: {published_text}: {exc}")

                  normalized = normalized_news_title(title)
                  if normalized in seen:
                      continue
                  seen.add(normalized)

                  selected.append({
                      "title": title,
                      "source": source,
                  })
                  if len(selected) >= NEWS_MAX_ITEMS:
                      break

              return selected


          def format_datetime(start):
              day = WEEKDAYS[start.weekday()]
              return f"{day} {start:%d.%m}, {start:%H:%M}"


          topic = os.environ.get("NTFY_TOPIC", "").strip()
          location = os.environ.get("WEATHER_LOCATION", "Pabianice").strip()

          if not topic:
              raise RuntimeError("Secret NTFY_TOPIC jest pusty")

          sections = []

          try:
              rain_alert, weather_text, temperature_24h = weather_report(location)
              sections.append(rain_alert)
              sections.append(weather_text)
              sections.append(temperature_24h)
          except Exception as exc:
              print(f"Błąd pogody: {exc}")
              sections.append(
                  f"🌤 Pogoda — {location}: nie udało się pobrać danych"
              )

          match_lines = ["🏟 Najbliższe mecze:"]

          try:
              match = next_poland_volleyball()
              if match:
                  start = datetime.fromtimestamp(match["timestamp"], TZ)
                  competition = (
                      f" ({match['competition']})"
                      if match.get("competition")
                      else ""
                  )
                  match_lines.append(
                      "• 🇵🇱 Polska (siatkówka M): "
                      f"{format_datetime(start)} — "
                      f"{match['home']} – {match['away']}{competition}"
                  )
              else:
                  match_lines.append(
                      "• 🇵🇱 Polska (siatkówka M): brak przyszłego meczu w źródłach"
                  )
          except Exception as exc:
              print(f"Błąd terminarza siatkówki: {exc}")
              match_lines.append(
                  "• 🇵🇱 Polska (siatkówka M): nie udało się pobrać terminarza"
              )

          for label, slug in FOOTBALL_TEAMS:
              try:
                  match = next_football_match(slug)
                  if match:
                      start, game = match
                      match_lines.append(
                          f"• {label}: {format_datetime(start)} — {game}"
                      )
                  else:
                      match_lines.append(
                          f"• {label}: brak przyszłego meczu w Fixtur.es"
                      )
              except Exception as exc:
                  print(f"Błąd terminarza dla {label}: {exc}")
                  match_lines.append(
                      f"• {label}: nie udało się pobrać terminarza"
                  )

          try:
              news = important_news()
              if news:
                  news_lines = ["📰 Najważniejsze newsy:"]
                  for item in news:
                      source_suffix = f" — {item['source']}" if item.get("source") else ""
                      news_lines.append(f"• {item['title']}{source_suffix}")
                  sections.append("\n".join(news_lines))
              else:
                  print("Brak świeżych newsów spełniających filtry")
          except Exception as exc:
              print(f"Błąd pobierania newsów: {exc}")

          sections.append("\n".join(match_lines))

          sections.append(
              "Źródła danych: Open-Meteo • Fixtur.es • Volleybox/ESPN • Google News"
          )
          message = "\n\n".join(sections)

          ntfy_req = urllib.request.Request(
              f"https://ntfy.sh/{urllib.parse.quote(topic, safe='')}",
              data=message.encode("utf-8"),
              headers={
                  "Title": "Poranny raport",
                  "Tags": "partly_sunny,soccer,volleyball",
                  "Content-Type": "text/plain; charset=utf-8",
              },
              method="POST",
          )

          with urllib.request.urlopen(ntfy_req, timeout=20) as response:
              print(f"Powiadomienie wysłane, HTTP {response.status}")

          print(message)
          PY
