name: Poranny raport

on:
  workflow_dispatch:
  schedule:
    - cron: "15 7 * * *"
      timezone: "Europe/Warsaw"

permissions:
  contents: read

jobs:
  send-notification:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pobierz pogodę i najbliższe mecze, a następnie wyślij ntfy
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WEATHER_LOCATION: "Pabianice"
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          TZ = ZoneInfo("Europe/Warsaw")
          USER_AGENT = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36"

          # SofaScore IDs. Endpoint zwraca mecze ze wszystkich rozgrywek drużyny.
          TEAMS = [
              ("🇵🇱 Polska (siatkówka M)", 6827),
              ("🔴 Widzew Łódź", 3115),
              ("⚪ Real Madryt", 2829),
              ("🔵🔴 FC Barcelona", 2817),
              ("🔴⚫ AC Milan", 2692),
          ]

          WMO = {
              0: "bezchmurnie",
              1: "przeważnie słonecznie",
              2: "częściowe zachmurzenie",
              3: "pochmurno",
              45: "mgła",
              48: "mgła z osadzaniem szadzi",
              51: "lekka mżawka",
              53: "mżawka",
              55: "silna mżawka",
              56: "lekka marznąca mżawka",
              57: "silna marznąca mżawka",
              61: "lekki deszcz",
              63: "deszcz",
              65: "silny deszcz",
              66: "lekki marznący deszcz",
              67: "silny marznący deszcz",
              71: "lekki śnieg",
              73: "śnieg",
              75: "silny śnieg",
              77: "ziarna śnieżne",
              80: "lekkie przelotne opady",
              81: "przelotne opady",
              82: "silne przelotne opady",
              85: "lekkie przelotne opady śniegu",
              86: "silne przelotne opady śniegu",
              95: "burze",
              96: "burze z lekkim gradem",
              99: "burze z silnym gradem",
          }

          WEEKDAYS = ["pon.", "wt.", "śr.", "czw.", "pt.", "sob.", "niedz."]


          def fetch_json(url, retries=2):
              last_error = None
              headers = {
                  "User-Agent": USER_AGENT,
                  "Accept": "application/json",
              }
              for attempt in range(retries + 1):
                  try:
                      req = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(req, timeout=20) as response:
                          return json.load(response)
                  except Exception as exc:
                      last_error = exc
                      if attempt < retries:
                          time.sleep(1.5 * (attempt + 1))
              raise last_error


          def weather_report(location):
              geo_params = urllib.parse.urlencode({
                  "name": location,
                  "count": 1,
                  "language": "pl",
                  "format": "json",
              })
              geo = fetch_json(
                  f"https://geocoding-api.open-meteo.com/v1/search?{geo_params}"
              )
              results = geo.get("results") or []
              if not results:
                  raise RuntimeError(f"Nie znaleziono lokalizacji: {location}")

              place = results[0]
              forecast_params = urllib.parse.urlencode({
                  "latitude": place["latitude"],
                  "longitude": place["longitude"],
                  "daily": ",".join([
                      "weather_code",
                      "temperature_2m_min",
                      "temperature_2m_max",
                      "precipitation_probability_max",
                      "precipitation_sum",
                      "wind_speed_10m_max",
                  ]),
                  "timezone": "Europe/Warsaw",
                  "forecast_days": 1,
              })
              data = fetch_json(
                  f"https://api.open-meteo.com/v1/forecast?{forecast_params}"
              )
              daily = data["daily"]

              code = int(daily["weather_code"][0])
              tmin = daily["temperature_2m_min"][0]
              tmax = daily["temperature_2m_max"][0]
              rain_prob = daily["precipitation_probability_max"][0]
              rain_sum = daily["precipitation_sum"][0]
              wind = daily["wind_speed_10m_max"][0]
              description = WMO.get(code, f"kod pogody {code}")

              return (
                  f"🌤 Pogoda — {place['name']}: {description}\n"
                  f"🌡 {tmin:.0f}–{tmax:.0f}°C | "
                  f"🌧 {rain_prob:.0f}% ({rain_sum:.1f} mm) | "
                  f"💨 do {wind:.0f} km/h"
              )


          def next_match(team_id):
              now_ts = datetime.now(TZ).timestamp()
              endpoints = [
                  f"https://api.sofascore.com/api/v1/team/{team_id}/events/next/0",
                  f"https://www.sofascore.com/api/v1/team/{team_id}/events/next/0",
              ]

              last_error = None
              for url in endpoints:
                  try:
                      data = fetch_json(url, retries=1)
                      events = [
                          event for event in data.get("events", [])
                          if event.get("startTimestamp", 0) >= now_ts
                      ]
                      if not events:
                          return None
                      return min(events, key=lambda event: event["startTimestamp"])
                  except Exception as exc:
                      last_error = exc

              raise last_error


          def format_match(event):
              start = datetime.fromtimestamp(event["startTimestamp"], TZ)
              home = event.get("homeTeam", {}).get("name", "?")
              away = event.get("awayTeam", {}).get("name", "?")
              competition = event.get("tournament", {}).get("name", "")
              day = WEEKDAYS[start.weekday()]
              return (
                  f"{day} {start:%d.%m}, {start:%H:%M} — "
                  f"{home} – {away}"
                  + (f" ({competition})" if competition else "")
              )


          topic = os.environ["NTFY_TOPIC"].strip()
          location = os.environ.get("WEATHER_LOCATION", "Pabianice").strip()
          if not topic:
              raise RuntimeError("Secret NTFY_TOPIC jest pusty")

          sections = []

          try:
              sections.append(weather_report(location))
          except Exception as exc:
              print(f"Błąd pogody: {exc}")
              sections.append(f"🌤 Pogoda — {location}: nie udało się pobrać danych")

          match_lines = ["🏟 Najbliższe mecze:"]
          for label, team_id in TEAMS:
              try:
                  event = next_match(team_id)
                  if event:
                      match_lines.append(f"• {label}: {format_match(event)}")
                  else:
                      match_lines.append(f"• {label}: brak zaplanowanego meczu")
              except Exception as exc:
                  print(f"Błąd terminarza dla {label}: {exc}")
                  match_lines.append(f"• {label}: nie udało się pobrać terminarza")

          sections.append("\n".join(match_lines))
          sections.append("Źródła danych: Open-Meteo • Sofascore")
          message = "\n\n".join(sections)

          ntfy_req = urllib.request.Request(
              f"https://ntfy.sh/{urllib.parse.quote(topic, safe='')}",
              data=message.encode("utf-8"),
              headers={
                  "Title": "Poranny raport",
                  "Tags": "partly_sunny,soccer",
                  "Content-Type": "text/plain; charset=utf-8",
              },
              method="POST",
          )

          with urllib.request.urlopen(ntfy_req, timeout=20) as response:
              print(f"Powiadomienie wysłane, HTTP {response.status}")
          print(message)
          PY
